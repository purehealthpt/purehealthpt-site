<title>Pure Health Physical Therapy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@400;500;700&amp;display=swap">
<style>
:root{--bg:#fff;--ink:#0d2b33;--muted:#4f6e76;--teal:#0f7886;--aqua:#27b5c1;--mist:#e9f7f8;--coral:#ff7a59;--line:#cfe3e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.7 Manrope,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0;line-height:1}
h1{font-size:clamp(2.5rem,7vw,6rem);letter-spacing:-.02em}
h2{font-size:clamp(2rem,4.6vw,3.7rem);letter-spacing:-.01em}
h3{font-size:clamp(1.5rem,2.8vw,2.2rem)}
p{margin:0 0 1em;max-width:58ch}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:1240px;margin:auto;padding:0 clamp(1.25rem,4vw,3rem)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:.7rem;padding-bottom:.7rem}
.brand img{display:block;height:50px;width:auto}
nav{display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.98rem;padding:.3rem 0;border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-color:var(--aqua)}
nav a.cta{background:var(--coral);border:0;border-radius:99px;padding:.55rem 1.2rem;font-weight:700}
.btn{display:inline-block;background:var(--coral);color:var(--ink);border:0;border-radius:99px;padding:1rem 1.8rem;font:700 1rem Manrope,sans-serif;text-decoration:none;cursor:pointer}
.btn.line{background:transparent;border:1.5px solid var(--ink)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:2rem}
.view{display:none}.view.on{display:block}

/* hero */
.hero{position:relative;min-height:calc(100svh - 76px);display:flex;align-items:flex-end;padding:5rem 0 4rem;overflow:hidden}
.waves{position:absolute;left:-10%;top:0;width:125%;height:100%;z-index:0;pointer-events:none;will-change:transform;opacity:.28}
.waves use{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.hero .wrap{position:relative;z-index:1;width:100%}
.hero h1 span{display:block;color:var(--teal)}.hero h1 span:first-child{padding-left:clamp(0rem,4.5vw,4rem)}.hero h1 span+span{padding-left:clamp(0rem,9vw,8rem)}
.hero .intro{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:3rem;align-items:end}
.hero .intro p{font-size:1.15rem;color:var(--muted);margin:0}
.hero .intro .row{margin:0;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){.waves use{stroke-dasharray:1;animation:draw 2.8s cubic-bezier(.3,.6,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}}

/* audiences */
.split{display:grid;grid-template-columns:1fr 1fr}
.split>div{padding:clamp(3rem,7vw,6rem) clamp(1.25rem,4vw,3rem)}
.split .a{background:var(--mist)}.split .b{background:var(--ink);color:#fff}
.split .b p{color:#c3dade}.split p{color:var(--muted);margin-top:1.5rem}
.split h2{max-width:11ch}
.kicker{font-weight:700;font-size:.95rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:.7rem}
.kicker::before{content:"";width:2.2rem;height:2px;background:var(--coral)}

/* method rows */
.method{padding:clamp(4rem,9vw,8rem) 0}
.method h2{max-width:14ch;margin-bottom:3rem}
.m{display:grid;grid-template-columns:4rem 1fr 1.1fr;gap:1.5rem 2rem;padding:2.2rem 0;border-top:1px solid var(--line);align-items:baseline;transition:padding-left .3s}
.m:last-child{border-bottom:1px solid var(--line)}
.m:hover{padding-left:1rem}
.m i{font:italic 1.5rem Fraunces,serif;color:var(--teal)}
.m p{margin:0;color:var(--muted)}

/* portrait collage */
.who{background:var(--mist);padding:clamp(4rem,9vw,8rem) 0;overflow:hidden}
.who .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);align-items:center}
.collage{position:relative;padding-bottom:18%}
.collage img{display:block;object-fit:cover;border-radius:200px 200px 12px 12px}
.collage .p1{width:72%;aspect-ratio:4/5;object-position:50% 15%}
.collage .p2{position:absolute;right:0;bottom:0;width:46%;aspect-ratio:1;border-radius:50%;object-position:50% 20%;border:8px solid var(--mist)}
.who p{color:var(--muted)}
.who h2{margin-bottom:1.5rem}
.creds{list-style:none;padding:0;margin:1.5rem 0}
.creds li{padding:.7rem 0;border-top:1px solid var(--line)}
.big-cta{padding:clamp(4rem,10vw,9rem) 0;text-align:left}
.big-cta a{font:500 clamp(2.3rem,6vw,5rem)/1.05 Fraunces,serif;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--coral)}
.big-cta a:hover{color:var(--teal)}

/* inner pages */
.page{padding:clamp(3.5rem,8vw,7rem) 0 clamp(4rem,8vw,7rem)}
.page>.wrap>h1{font-size:clamp(2.6rem,6.2vw,5rem);max-width:16ch}
.lead{font-size:1.3rem;color:var(--muted);margin-top:2rem;max-width:50ch}
.cols{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,6vw,6rem);margin-top:4rem;align-items:start}
.pts{display:grid;gap:0}.pts div{padding:1.6rem 0;border-top:1px solid var(--line)}.pts h3{margin-bottom:.5rem;font-size:2rem}.pts p{margin:0;color:var(--muted)}

/* forms */
form{display:grid;gap:1.6rem}
fieldset{border:0;padding:0;margin:0}
legend,label{font-weight:700;font-size:.92rem;display:block;margin-bottom:.4rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:.6rem 0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 2px 0 var(--teal)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opt,.slot{position:relative}
.opt input,.slot input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.opt span{display:block;border:1.5px solid var(--line);border-radius:14px;padding:1rem 1.1rem;font:400 1.5rem Fraunces,serif;height:100%}
.opt small{display:block;font:400 .9rem Manrope,sans-serif;color:var(--muted)}
.opt input:checked+span{border-color:var(--teal);background:var(--mist)}
.slots{display:flex;flex-wrap:wrap;gap:.5rem}
.slot span{display:block;border:1.5px solid var(--line);border-radius:99px;padding:.45rem 1rem;font-weight:500}
.slot input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt input:focus-visible+span,.slot input:focus-visible+span{outline:3px solid var(--coral)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.err{color:#b3261e;font-weight:700;min-height:1.2em;margin:0}
.note{font-size:.9rem;color:var(--muted)}
#done{display:none;background:var(--mist);border-radius:16px;padding:2rem}
#done h3{margin-bottom:1rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.5rem 2rem;margin:0}dt{font-weight:700}dd{margin:0}
.mail{font:500 clamp(1.6rem,4vw,3rem)/1.15 Fraunces,serif;word-break:break-word}
footer{background:var(--ink);color:#c3dade;padding:3rem 0;font-size:.95rem}
footer .wrap{display:flex;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
footer a{color:#fff}
@media (max-width:820px){.hero .intro,.split,.who .wrap,.cols,.f2,.opts{grid-template-columns:1fr}.hero .intro .row{justify-content:flex-start}.m{grid-template-columns:2.5rem 1fr}.m p{grid-column:2}.hero{min-height:auto}}
@media (max-width:560px){.lg{display:none}.brand img{height:40px}.bar{gap:.4rem}nav{gap:.6rem;width:100%;justify-content:space-between}nav a{font-size:.86rem}nav a.cta{padding:.5rem 1.1rem}.hero{padding:2.5rem 0}.hero .intro{margin-top:2rem}.row{flex-direction:column}.btn{width:100%;text-align:center}.split>div{padding:3rem 1.25rem}.m{padding:1.6rem 0}.m:hover{padding-left:0}.collage{padding-bottom:22%}.page>.wrap>h1{font-size:clamp(2.3rem,10vw,3rem)}.mail{font-size:1.5rem}footer .wrap{flex-direction:column}#done{padding:1.4rem}.big-cta a{font-size:2.2rem}}

.norun .waves use{animation:none!important}
.ebtn{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:.8rem 1.3rem;font:700 .95rem Manrope,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(13,43,51,.3)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:40;background:#fff;box-shadow:-8px 0 30px rgba(13,43,51,.25);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{display:flex}
.dh{padding:1rem 1.2rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem}
.dh h2{font-size:1.5rem}.dh p{margin:0;font-size:.88rem;color:var(--muted)}
.db{overflow:auto;padding:.5rem 1.2rem 1.5rem;flex:1}
.drawer details{border-bottom:1px solid var(--line);padding:.9rem 0}
.drawer summary{font:500 1.25rem Fraunces,serif;cursor:pointer}
.drawer details>div{display:grid;gap:1rem;margin-top:1rem}
.drawer label{font-size:.85rem;margin:0 0 .25rem}
.drawer input,.drawer textarea,.drawer select{border:1.5px solid var(--line);border-radius:8px;padding:.55rem .7rem;font-size:1rem}
.drawer input[type=checkbox]{width:auto}
.drawer .help{font-size:.8rem;color:var(--muted);margin:.2rem 0 0}
.vt{border:1px solid var(--line);border-radius:12px;padding:.9rem;display:grid;gap:.7rem}
.hr{display:grid;grid-template-columns:3.2rem 1fr 1fr auto;gap:.5rem;align-items:center}
.hr span{font-weight:700;font-size:.9rem}.hr label{display:flex;gap:.3rem;align-items:center;margin:0}
.df{padding:1rem 1.2rem;border-top:1px solid var(--line);display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.df .btn{padding:.7rem 1.3rem}.df .st{font-size:.88rem;color:var(--muted);flex:1;min-width:8rem}
.sm{background:transparent;border:1.5px solid var(--line);border-radius:99px;padding:.4rem .9rem;font:600 .85rem Manrope,sans-serif;cursor:pointer}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:3rem}.pick{display:flex;flex-direction:column;gap:1rem;padding:2.2rem;border-radius:16px;text-decoration:none;color:var(--ink);background:var(--mist);transition:transform .2s}.pick:nth-child(2){background:var(--ink);color:#fff}.pick:nth-child(2) p{color:#c3dade}.pick p{color:var(--muted);margin:0}.pick:hover{transform:translateY(-4px)}.pick .btn{margin-top:1rem;align-self:flex-start}@media (max-width:820px){.choose{grid-template-columns:1fr}.pick .btn{width:100%;text-align:center}}
.arch{display:block;width:100%;max-width:420px;aspect-ratio:4/5;object-fit:cover;object-position:50% 15%;border-radius:220px 220px 14px 14px}@media (max-width:820px){.arch{max-width:300px}}
.big-cta{text-align:center}.big-cta a.btn{font:700 1.1rem Manrope,sans-serif;color:var(--ink);border:0;padding:1.15rem 2.4rem}
</style>
</head>

<script type="application/json" id="site-data">{"site": {"footer": "© 2026 Pure Health Physical Therapy", "footerRight": "Maegan Olivos, PT, DPT, MPH, GCS"}, "home": {"h1a": "Move Better.", "h1b": "Live Better.", "h1c": "Stay Active.", "intro": "Pure Health is a cash based, mobile outpatient physical therapy practice for adults returning to sport after injury, and for older adults who want to stay mobile and active.", "btn1": "Book an initial consultation", "btn2": "Meet Maegan", "aKick": "Adults returning to sport", "aTitle": "Back to the sport you love.", "aText": "All levels of adult athlete returning to sport, with a special focus on triathletes and swimmers.  We guide your return to sport in stages and test each one before progressing to the next.", "bKick": "Older adults", "bTitle": "Staying strong, steady, and independent.", "bText": "Balance, strength, mobility, and manual techniques designed for people who want to maintain independence, relieve pain, and keep doing what they enjoy throughout their lifespan.", "methodTitle": "Three parts to every plan.", "methods": [{"t": "Initial consultation", "d": "A full, unhurried hour. We go through your history and goals, then examine how you move and what is limiting you."}, {"t": "Individualized, evidence-based treatment", "d": "Your plan comes from your evaluation and current research, not a standard handout. Hands-on care and exercise are adjusted as you change."}, {"t": "Measurable improvement", "d": "We track strength, range of motion, balance, and functional tests, and review the numbers with you so progress is clear."}], "whoTitle": "Every visit is with Maegan.", "whoText": "Maegan Olivos is a Doctor of Physical Therapy with a Master of Public Health and is a Board Certified Specialist in Geriatric Physical Therapy as well as Dry Needling Certified. She is also a published rehabilitation researcher and teaches future physical therapists in local universities.", "whoBtn": "Learn more", "ctaText": "Book your first visit"}, "about": {"title": "A mobile, independent practice built on time, convenience, and evidence.", "lead": "Pure Health exists so that people get a therapist’s full attention, a plan based on research, and results they can see.", "practiceTitle": "How we practice", "pts": [{"t": "One therapist, full attention", "d": "You are not handed off or split between providers. Every session is with Maegan."}, {"t": "Grounded in research", "d": "Treatment choices rest on the best available evidence and on what your own individual outcomes and testing demonstrate."}, {"t": "Clear measures", "d": "You will know where you started, where you are now, and a projected timeline of what comes next."}], "bioTitle": "Maegan Olivos, PT, DPT, MPH, GCS", "bio": "Maegan is the owner of Pure Health and treats every patient personally. Her work combines clinical practice with research and teaching, with a focus on older adults, injury prevention, and on adults returning to sport after injury.", "creds": ["Board-Certified Specialist in Geriatric Physical Therapy", "Dry Needling Certified", "Postdoctoral Research Fellowship in Rehabilitation Science, CU Anschutz (2020–2023)", "Affiliate Faculty, Regis University Department of Rehabilitation and Health Sciences", "Treasurer, APTA Colorado", "Delegate-at-Large, APTA Colorado"], "linkedin": "", "btn": "Book with Maegan", "practiceText": "Maegan is a mobile physical therapist. She will come to your home with all equipment needed for your appointment.\n\nAll appointments are $200/hour and require 24 hours advanced booking. Maegan does not accept insurance at this time."}, "book": {"title": "Book a visit.", "lead": "Schedule your initial consultation in our secure booking system.", "note": "Booking opens in a new tab. For urgent medical problems, call your doctor or 911.", "visitTypes": [{"name": "Initial consultation", "length": 60, "desc": "new clients", "on": true}, {"name": "Follow-up visit", "length": 45, "desc": "current clients", "on": true}], "slotMinutes": 60, "daysAhead": 14, "closedDates": "", "hours": {"mon": {"open": "08:00", "close": "17:00", "closed": false}, "tue": {"open": "08:00", "close": "17:00", "closed": false}, "wed": {"open": "08:00", "close": "17:00", "closed": false}, "thu": {"open": "08:00", "close": "17:00", "closed": false}, "fri": {"open": "08:00", "close": "13:00", "closed": false}, "sat": {"open": "08:00", "close": "13:00", "closed": true}, "sun": {"open": "08:00", "close": "13:00", "closed": true}}, "email": "scheduling@purehealthpt.com", "newKick": "New clients", "newTitle": "Your first visit", "newText": "Sign up and book your initial consultation with Maegan.", "newBtn": "Book as a new client", "newUrl": "https://purehealthphysicaltherapy.janeapp.com/validated_users/new", "retUrl": "https://purehealthphysicaltherapy.janeapp.com/login"}, "contact": {"title": "Let’s talk.", "lead": "Questions about whether physical therapy fits your situation or how to get started? Send us a message and we’ll get back to you.", "formTo": "info@purehealthpt.org"}}</script>
